<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Odo Energy Display</title>

  <link rel="stylesheet" href="car.css" />

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
    }

    .label {
      font-size: 18px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 12px;
    }

    .odometer {
      font-size: 72px;
    }

    .unit {
      margin-top: 10px;
      font-size: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="label">HOUSE LOAD</div>
    <div id="load" class="odometer">0.00</div>
    <div class="unit">kW</div>
  </div>

  <script src="odo.js"></script>

  <script>
    setTimeout(function () {
      document.getElementById("load").innerHTML = 3.42;
    }, 1000);

    setInterval(function () {
      const fakeValue = (Math.random() * 8).toFixed(2);
      document.getElementById("load").innerHTML = fakeValue;
    }, 5000);
  </script>
</body>
</html>
