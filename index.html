<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Energy Counter</title>

  <link rel="stylesheet" href="car.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
    }

    .label {
      font-size: 20px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .odometer {
      font-size: 96px;
      line-height: 1;
    }

    .unit {
      margin-top: 15px;
      font-size: 22px;
      color: #888;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="label">HOUSE LOAD</div>

  <div id="load" class="odometer">
    0.00
  </div>

  <div class="unit">kW</div>
</div>

<script src="odometer.js"></script>

<script>
  var odometer = new Odometer({
    el: document.getElementById("load"),
    value: 0,
    theme: "car",
    format: "(,ddd).dd",
    duration: 1000
  });

  odometer.render();

  setTimeout(function () {
    odometer.update(3.42);
  }, 1000);

  setInterval(function () {
    var fakeValue = (Math.random() * 8).toFixed(2);
    odometer.update(fakeValue);
  }, 5000);
</script>

</body>
</html>
